name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that supersedes an in-flight run should cancel it rather than queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  stack:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          # The checkout belongs to the runner, not to the image's node user,
          # so ./media is read-only to the API unless it runs as the runner.
          # This is the same knob a USB drive or a NAS mount needs.
          sed -i "s/^API_UID=.*/API_UID=$(id -u)/;s/^API_GID=.*/API_GID=$(id -g)/" .env
          docker compose up --build -d --wait --wait-timeout 180

      # Proves the migrations apply from an empty database and that the whole
      # chain from nginx to API to Postgres is wired, which unit tests cannot.
      - name: Verify health through the proxy
        run: |
          report=$(curl -fsS http://localhost:8080/healthCheck)
          status=$(jq -r .status <<< "$report")
          echo "health: $status"

          # "degraded" on its own does not say which probe is unhappy, which
          # turns a one-line CI failure into an afternoon. Name it.
          if [ "$status" != "ok" ]; then
            jq -r '.checks[] | select(.healthy == false)
                   | "  check \(.name): \(.message // "failing, no message")"' <<< "$report"
            jq -r '.tasks[] | select(.lastError != null)
                   | "  task \(.name): \(.lastError)"' <<< "$report"
            exit 1
          fi

      - name: Verify the SPA and its deep links are served
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/calendar
          curl -fsS -o /dev/null http://localhost:8080/openapi.json

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: Multi-arch images
    runs-on: ubuntu-latest
    # Only worth the emulation cost once the code is known good.
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # arm64 is the Raspberry Pi target; amd64 keeps the images usable on a
      # normal desktop or server.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
