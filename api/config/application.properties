# ---------------------------------------------------------------------------
# family-dash API properties
#
# Every value here can be overridden by an environment variable using the
# mapping in lib/core/AppProperties.ts (env always wins), which is how
# docker-compose supplies secrets. This file holds the defaults and the
# settings you are unlikely to want in the environment.
# ---------------------------------------------------------------------------

[server]
port=3000
# Comma-separated list, or * to allow any origin. The UI is served from the
# same host through the nginx proxy, so same-origin is the normal case.
cors.origins=*
body.limit=10mb

[logging]
# error | warn | info | debug
level=info

[database]
# Connection details come from the standard PG* environment variables that
# node-postgres reads on its own. These control pool behaviour only.
pool.max=8
pool.idleTimeoutMillis=30000
pool.connectionTimeoutMillis=10000
migrate.onStartup=true

[media]
root=/media
photos.dir=photos
thumbs.dir=thumbs
drawings.dir=drawings
thumbnail.width=480
upload.maxBytes=26214400

[tasks]
# Cron expressions for the background refresh jobs. All five-field standard
# cron. Set enabled=false to stop a job entirely.
enabled=true
calendar.sync.cron=*/15 * * * *
news.fetch.cron=*/30 * * * *
weather.refresh.cron=*/20 * * * *
photos.scan.cron=0 * * * *

[calendar]
# How wide a window the background sync keeps cached. Feeds are fetched whole
# and expanded into this range, so a wider window means slower syncs and more
# rows; a year ahead covers school terms and annual events comfortably.
sync.pastDays=45
sync.futureDays=365

[weather]
provider=open-meteo
latitude=49.2827
longitude=-123.1207
location.name=Vancouver
units=metric
