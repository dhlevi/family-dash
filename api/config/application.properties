# ---------------------------------------------------------------------------
# family-dash API properties
#
# Every value here can be overridden by an environment variable using the
# mapping in lib/core/AppProperties.ts (env always wins), which is how
# docker-compose supplies secrets. This file holds the defaults and the
# settings you are unlikely to want in the environment.
# ---------------------------------------------------------------------------

[server]
port=3000
# Comma-separated list, or * to allow any origin. The UI is served from the
# same host through the nginx proxy, so same-origin is the normal case.
cors.origins=*
body.limit=10mb

[logging]
# error | warn | info | debug
level=info

[database]
# Connection details come from the standard PG* environment variables that
# node-postgres reads on its own. These control pool behaviour only.
pool.max=8
pool.idleTimeoutMillis=30000
pool.connectionTimeoutMillis=10000
migrate.onStartup=true

[media]
root=/media
photos.dir=photos
thumbs.dir=thumbs
# Generated map artwork for the screensaver. Kept apart from the photo library
# so a background task is never writing into a folder somebody curates by hand.
cityart.dir=cityart
# Thumbnails fill the album tiles; display copies stand in for formats a
# browser cannot show (HEIC) and are sized for the panel, not the tile.
thumbnail.width=480
display.width=2048
upload.maxBytes=26214400

[tasks]
# Cron expressions for the background refresh jobs. All five-field standard
# cron. Set enabled=false to stop a job entirely.
enabled=true
calendar.sync.cron=*/15 * * * *
news.fetch.cron=*/30 * * * *
weather.refresh.cron=*/20 * * * *
photos.scan.cron=0 * * * *
# One new map artwork every three hours, at an odd minute so it does not start
# in the same second as everything else after a reboot.
cityart.refresh.cron=17 */3 * * *

[cityart]
# Vector tiles for the screensaver's map artwork. OpenFreeMap needs no key and
# no account; point this at your own tile server if you would rather not depend
# on it. The path to the tiles themselves is read from this document, because
# the planet build is dated and rolls forward — a hardcoded tile URL works
# until it quietly stops.
tiles.url=https://tiles.openfreemap.org/planet
tiles.timeoutMs=20000
# Long edge of a generated picture, in pixels. 2000 is a little more than a
# 16-inch panel resolves and keeps each artwork under a megabyte.
size=2000

[google]
# OAuth client for the Google Calendar provider. Set these in .env as
# GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET rather than here! A client
# secret does not belong in a file that is committed. Leave them empty and
# the Google provider simply reports itself as unconfigured; the local
# calendar and ICS subscriptions do not need them.
clientId=
clientSecret=

[calendar]
# How wide a window the background sync keeps cached. Feeds are fetched whole
# and expanded into this range, so a wider window means slower syncs and more
# rows; a year ahead covers school terms and annual events comfortably.
sync.pastDays=45
sync.futureDays=365

[weather]
# open-meteo needs no API key and is the default for that reason. Switching to
# openweathermap requires a key; if it is missing, the service falls back to a
# provider that works rather than leaving the page empty.
provider=open-meteo
openweathermap.apiKey=
latitude=49.2827
longitude=-123.1207
location.name=Vancouver
units=metric
