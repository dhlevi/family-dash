# ---------------------------------------------------------------------------
# family-dash web
#
# Serves the built Vue app and proxies everything the API owns, so the
# browser only ever talks to one origin. That keeps CORS out of the picture
# and means the only port published on the LAN is this one.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Pi serves this over a LAN to one or two screens; compressing the
    # bundle costs it almost nothing and helps a slow wifi link.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Photos can be large, and a slideshow buffers ahead.
    # Bounds a photo upload. This is also what bounds the API's memory while
    # one is in flight: multer buffers the files it is given, so the total
    # request size is the ceiling, not the per-file limit times the file
    # count. Keep it to something a Raspberry Pi can hold.
    client_max_body_size 120m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # $http_host rather than $host, because it keeps the port. The API
        # builds the Google OAuth redirect URI from this header, and Google
        # matches redirect URIs exactly — dropping ":8080" sends the browser
        # to port 80 after consent and the connection fails.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upload of a few dozen photos, or a manual feed refresh, can take
        # longer than the 60s default.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Let the API's own cache headers through untouched.
        proxy_buffering off;
    }

    location = /healthCheck {
        proxy_pass http://api:3000/healthCheck;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # The swagger UI, and the generated document it reads. `/openapi`
    # redirects to `/openapi/`, which swagger-ui-express serves.
    location /openapi {
        proxy_pass http://api:3000/openapi;
        proxy_set_header Host $http_host;
    }

    location = /openapi.json {
        proxy_pass http://api:3000/openapi.json;
        proxy_set_header Host $http_host;
    }

    # --- media -------------------------------------------------------------
    # Photo files and drawing thumbnails, served by the API from the mounted
    # volume. Cached hard: the scanner writes new paths rather than
    # overwriting existing ones.
    location /media/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- static app --------------------------------------------------------
    # Hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or the kiosk keeps booting an old
    # bundle that references assets a deploy has already removed.
    # `expires` is left off deliberately: it emits a second, weaker
    # Cache-Control header that contradicts this one.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA history fallback: deep links like /calendar are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
